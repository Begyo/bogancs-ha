dose:
  name: Adag beadva
  description: >-
    Megjelöli az adagot beadottként, vagy visszavonja. Automatizálásból hívható,
    például amikor a gyógyszeres doboz érzékelője jelez.
  fields:
    medication:
      name: Gyógyszer azonosítója
      description: A gyógyszer azonosítója. A "Mai adagok" szenzor doses attribútumában találod.
      required: true
      example: "abc123def456ghi"
      selector:
        text:
    scheduled:
      name: Időpont
      description: A beütemezett időpont (óó:pp). Üresen hagyva eseti beadásként rögzül.
      required: false
      example: "08:00"
      selector:
        text:
    given:
      name: Beadva
      description: Igaz = beadva, hamis = a beadás visszavonása.
      required: false
      default: true
      selector:
        boolean:
    missed:
      name: Kimaradt
      description: >-
        Igaz = az adag KIMARADT (nem kapta meg). Ez erosebb a "Beadva" mezonel: ha be van
        jelolve, az adag kimaradtkent rogzul, akkor is, ha a Beadva igaz.
      required: false
      default: false
      selector:
        boolean:
    reason:
      name: A kimaradas oka
      description: Nem kotelezo, a naploba kerul (pl. kihanyta, nem volt itthon).
      required: false
      example: "kihányta"
      selector:
        text:
    by:
      name: Ki adta be
      description: Ez a név kerül a naplóba.
      required: false
      default: "Home Assistant"
      selector:
        text:

feed:
  name: Etetés megtörtént
  description: >-
    Megjelöli az etetést megtörténtként, vagy visszavonja. Automatizálásból hívható,
    például amikor az automata etető jelez.
  fields:
    feeding:
      name: A táp azonosítója
      description: A táp azonosítója. A "Hátralévő etetés" szenzor rows attribútumában találod.
      required: true
      example: "abc123def456ghi"
      selector:
        text:
    alkalom:
      name: Hányadik alkalom
      description: A napi etetések közül a hányadik (1-től). Napi egy etetésnél hagyd 1-en.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 12
          mode: box
    fed:
      name: Megetette
      description: Igaz = megetette, hamis = a bejegyzés visszavonása.
      required: false
      default: true
      selector:
        boolean:
    by:
      name: Ki etette meg
      description: Ez a név kerül a naplóba.
      required: false
      default: "Home Assistant"
      selector:
        text:
