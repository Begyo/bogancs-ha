dose:
  name: Adag beadva
  description: >-
    Megjelöli az adagot beadottként, vagy visszavonja. Automatizálásból hívható,
    például amikor a gyógyszeres doboz érzékelője jelez.
  fields:
    medication:
      name: Gyógyszer azonosítója
      description: A gyógyszer azonosítója. A "Mai adagok" szenzor doses attribútumában találod.
      required: true
      example: "abc123def456ghi"
      selector:
        text:
    scheduled:
      name: Időpont
      description: A beütemezett időpont (óó:pp). Üresen hagyva eseti beadásként rögzül.
      required: false
      example: "08:00"
      selector:
        text:
    given:
      name: Beadva
      description: Igaz = beadva, hamis = a beadás visszavonása.
      required: false
      default: true
      selector:
        boolean:
    missed:
      name: Kimaradt
      description: >-
        Igaz = az adag KIMARADT (nem kapta meg). Ez erosebb a "Beadva" mezonel: ha be van
        jelolve, az adag kimaradtkent rogzul, akkor is, ha a Beadva igaz.
      required: false
      default: false
      selector:
        boolean:
    reason:
      name: A kimaradas oka
      description: Nem kotelezo, a naploba kerul (pl. kihanyta, nem volt itthon).
      required: false
      example: "kihányta"
      selector:
        text:
    by:
      name: Ki adta be
      description: Ez a név kerül a naplóba.
      required: false
      default: "Home Assistant"
      selector:
        text:
